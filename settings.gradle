pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        maven {
            name = 'Forge'
            url = 'https://maven.minecraftforge.net/'
        }
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'Sponge Snapshots'
            url = 'https://repo.spongepowered.org/repository/maven-public/'
        }
    }
}

rootProject.name = 'Medieval-Origins-Revival'
// ⚠⚠ **当部は fabric を建てない（2026-09-08 に外した）。**
//
// ⚠ gradle は **設定の段階で** settings.gradle の全プロジェクトを読むので、
//   ⚠ fabric を並べておくだけで `:fabric` の依存解決がそこで走る。
//   ⚠⚠ **その置き場が次々に応答しないので、`:forge:build` まで落ちていた。**
//
//     REI    `repo.greenhouse.house` → 301 → `maven.greenhouse.lgbt` が TCP で時間切れ
//     Apugli `maven.parchmentmc.org` が時間切れ／`maven.merchantpug.net` は **名前解決できない**
//
// ⚠ `--offline` も通らない（⚠ **キャッシュに一度も入っていない**＝過去のビルドでも取れていない）。
// ⚠ 1本ずつ向け直すと次が出るので、**建てる対象から外した**。
// ⚠ 当部が配るのは Forge だけなので、失うものは無い。
//
// ⚠ **上流へ戻すときは fabric を戻す**（上流の環境では届く）。
//   ⚠ 同じ相手を止めた注記が `forge/build.gradle` と `common/build.gradle` に
//   2026-09-02 から在る。
include("common", "forge")